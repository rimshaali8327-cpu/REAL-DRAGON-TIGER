<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragon Tiger — Lacquer Hall</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root{
    --black:#0b0705;
    --panel:#150b09;
    --lacquer:#6e0f1a;
    --deep-red:#3d0810;
    --gold:#c9a227;
    --gold-bright:#e8c766;
    --ivory:#f2e6c9;
    --muted:#a68f6b;
    --jade:#2f6f5e;
    --jade-bright:#3f9c81;
    --danger:#c1452e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Sans',sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(110,15,26,0.35), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(201,162,39,0.10), transparent 50%),
      var(--black);
    color:var(--ivory);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px;
  }
  #app{width:100%;max-width:460px;}

  h1,h2,h3{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.02em;}

  .frame{
    position:relative;
    background:linear-gradient(180deg,var(--panel),#0e0705);
    border:1px solid rgba(201,162,39,0.35);
    border-radius:6px;
    padding:26px 22px;
  }
  .frame::before,.frame::after{
    content:"";position:absolute;width:16px;height:16px;
    border:1.5px solid var(--gold);opacity:.75;
  }
  .frame::before{top:6px;left:6px;border-right:none;border-bottom:none;}
  .frame::after{bottom:6px;right:6px;border-left:none;border-top:none;}
  .frame .corner-tr,.frame .corner-bl{position:absolute;width:16px;height:16px;border:1.5px solid var(--gold);opacity:.75;}
  .frame .corner-tr{top:6px;right:6px;border-left:none;border-bottom:none;}
  .frame .corner-bl{bottom:6px;left:6px;border-right:none;border-top:none;}

  .hairline{height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,39,.5),transparent);margin:18px 0;}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;}
  .brand-title{font-size:23px;color:var(--gold-bright);}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}
  .player-chip{text-align:right;font-size:12px;color:var(--muted);}
  .player-chip .coins{color:var(--gold-bright);font-weight:700;font-size:15px;display:block;margin-top:2px;}

  /* ---------- Buttons / inputs ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border-radius:4px;
    background:#0f0806;border:1px solid rgba(201,162,39,.3);
    color:var(--ivory);font-size:14px;font-family:'Noto Sans',sans-serif;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  .btn{
    width:100%;padding:13px;border-radius:4px;border:1px solid transparent;
    font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:.03em;
    cursor:pointer;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  .btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#241304;}
  .btn-outline{background:transparent;border:1px solid rgba(201,162,39,.45);color:var(--gold-bright);}
  .btn-jade{background:linear-gradient(180deg,var(--jade-bright),var(--jade));color:#08211a;}
  .btn-danger{background:transparent;border:1px solid rgba(193,69,46,.6);color:#e08066;}
  .link-btn{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}

  .status-msg{font-size:13px;text-align:center;min-height:18px;margin-top:10px;}
  .status-ok{color:var(--jade-bright);}
  .status-err{color:#e08066;}

  /* ---------- Auth screen ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab-btn{flex:1;padding:9px;background:transparent;border:1px solid rgba(201,162,39,.25);
    color:var(--muted);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.05em;border-radius:4px;cursor:pointer;}
  .tab-btn.active{background:rgba(201,162,39,.12);color:var(--gold-bright);border-color:var(--gold);}

  .capture-box{
    border:1px dashed rgba(201,162,39,.4);border-radius:6px;padding:12px;text-align:center;margin-bottom:14px;
  }
  .capture-box video,.capture-box img{
    width:100%;max-width:220px;border-radius:4px;margin:0 auto 10px;display:block;border:1px solid rgba(201,162,39,.3);
  }
  .capture-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}

  /* ---------- Pending / rejected ---------- */
  .center-note{text-align:center;padding:30px 10px;}
  .center-note .glyph{font-size:34px;margin-bottom:14px;}
  .center-note h2{color:var(--gold-bright);font-size:18px;margin-bottom:10px;}
  .center-note p{font-size:13px;color:var(--muted);line-height:1.7;}

  /* ---------- Game table ---------- */
  .table{
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(180deg,#1a0a0b,#0e0505);
    border:1px solid var(--lacquer);border-radius:6px;padding:26px 10px;margin-bottom:14px;
    position:relative;
  }
  .card-slot{text-align:center;flex:1;}
  .card-slot h2{font-size:12px;letter-spacing:.18em;margin-bottom:10px;color:var(--muted);}
  #dragonSlot h2{color:#9fc7ff;}
  #tigerSlot h2{color:#ffb56b;}
  .card{
    width:64px;height:92px;background:linear-gradient(180deg,#fbf3dd,#f2e2b3);color:#241304;
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-family:'Cinzel',serif;font-weight:700;margin:0 auto;
    box-shadow:0 0 18px rgba(201,162,39,.35);border:1px solid var(--gold);
  }
  .vs{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);padding:0 6px;}
  .result-text{text-align:center;min-height:22px;font-size:14px;font-weight:600;margin-bottom:12px;}
  .result-win{color:var(--jade-bright);}
  .result-lose{color:#e08066;}
  .result-tie{color:var(--gold-bright);}

  .bet-buttons{display:flex;gap:8px;margin-bottom:12px;}
  .bet-btn{flex:1;padding:11px 4px;border-radius:4px;border:1px solid rgba(201,162,39,.25);
    cursor:pointer;font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.03em;
    background:#0f0806;color:var(--muted);transition:.15s ease;}
  .bet-btn.selected{border-color:var(--gold);color:var(--gold-bright);background:rgba(201,162,39,.12);}

  .leaderboard{margin-top:16px;}
  .leaderboard h3{font-size:13px;color:var(--gold-bright);margin-bottom:10px;letter-spacing:.04em;}
  #leaderboardList{list-style:none;font-size:13px;}
  #leaderboardList li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(201,162,39,.12);}
  #leaderboardList li span:first-child{color:var(--ivory);}
  #leaderboardList li span:last-child{color:var(--gold-bright);font-weight:600;}

  .disclaimer{text-align:center;font-size:10.5px;color:var(--muted);margin-top:14px;line-height:1.6;}

  .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}

  /* ---------- Admin ---------- */
  .admin-user-row{
    border:1px solid rgba(201,162,39,.2);border-radius:5px;padding:12px;margin-bottom:10px;font-size:13px;
  }
  .admin-user-row .row-name{color:var(--gold-bright);font-weight:600;margin-bottom:4px;}
  .admin-user-row .row-meta{color:var(--muted);font-size:11.5px;line-height:1.6;margin-bottom:8px;}
  .admin-user-row img{width:100%;max-width:120px;border-radius:4px;margin-bottom:8px;border:1px solid rgba(201,162,39,.3);}
  .admin-actions{display:flex;gap:8px;}
  .admin-actions .btn{padding:9px;font-size:12px;}
  
  /* فکس کی گئی کلاسز اور ٹیگز */
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:.03em;font-family:'Cinzel',serif;}
  .badge-pending{background:rgba(201,162,39,.15);color:var(--gold-bright);border:1px solid rgba(201,162,39,.3);}
  .badge-approved{background:rgba(47,111,94,.15);color:var(--jade-bright);border:1px solid rgba(47,111,94,.3);}
  .badge-rejected{background:rgba(193,69,46,.15);color:var(--danger);border:1px solid rgba(193,69,46,.3);}
</style>
</head>
<body>

<div id="app">
  <div class="frame">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    
    <!-- ٹاپ بار -->
    <div class="topbar">
      <div>
        <h1 class="brand-title">Dragon Tiger</h1>
        <div class="brand-sub">LACQUER HALL</div>
      </div>
      <div class="player-chip">
        Balance
        <span class="coins">1,500 🪙</span>
      </div>
    </div>

    <div class="hairline"></div>

    <!-- گیم ٹیبل سکرین -->
    <div class="table">
      <div class="card-slot" id="dragonSlot">
        <h2>DRAGON</h2>
        <div class="card">K</div>
      </div>
      <div class="vs">VS</div>
      <div class="card-slot" id="tigerSlot">
        <h2>TIGER</h2>
        <div class="card">8</div>
      </div>
    </div>

    <!-- رزلٹ اور بیٹ بٹنز -->
    <div class="result-text result-win">Dragon Wins!</div>
    
    <div class="bet-buttons">
      <button class="bet-btn selected">Dragon (1:1)</button>
      <button class="bet-btn">Tie (11:1)</button>
      <button class="bet-btn">Tiger (1:1)</button>
    </div>

    <button class="btn btn-gold">Place Bet</button>

    <div class="hairline"></div>

    <!-- لیڈر بورڈ -->
    <div class="leaderboard">
      <h3>Top Players</h3>
      <ul id="leaderboardList">
        <li><span>Player_99</span> <span>5,420 🪙</span></li>
        <li><span>TigerKing</span> <span>4,150 🪙</span></li>
        <li><span>Zain_01</span> <span>3,900 🪙</span></li>
      </ul>
    </div>

    <div class="disclaimer">
      This is a simulation platform. Please play responsibly.
    </div>
  </div>
</div>

</body>
</html>
